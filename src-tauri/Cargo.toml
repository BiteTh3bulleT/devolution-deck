[package]
name = "devolution-deck"
version = "0.5.0"
description = "DEVOLUTION//DECK - Desktop DAW for DJ Devooo"
authors = ["DevoDeck"]
edition = "2021"
default-run = "devolution-deck"
autobins = false

[lib]
name = "devolution_deck_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[features]
test-tools = []

[[bin]]
name = "devolution-deck"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
symphonia = { version = "0.5", default-features = false, features = ["all"] }
base64 = "0.21"
uuid = { version = "1", features = ["v4"] }
cpal = "0.15"
hound = "3.5"
libloading = "0.8"
walkdir = "2.5"
midir = "0.10"
ureq = { version = "2.10", default-features = true, features = ["json"] }
rack = "0.4.8"
tempfile = "3"
rustfft = "6"
rtrb = "0.4.0"

[patch.crates-io]
rack = { path = "../vendor/rack" }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-shell = "2"
